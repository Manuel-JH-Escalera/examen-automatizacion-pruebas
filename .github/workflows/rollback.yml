# =============================================================================
# ROLLBACK MANUAL
#
# Permite volver el ambiente de pruebas a cualquier versión publicada
# (por defecto la última marcada como "stable"). Se lanza desde la pestaña
# Actions > "Rollback manual" > Run workflow.
# =============================================================================
name: Rollback manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la imagen a restaurar (ej. stable o sha-abc1234)"
        required: true
        default: stable

concurrency:
  group: deploy-ambiente-pruebas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: "Rollback a la versión indicada"
    runs-on: ubuntu-latest
    environment:
      name: pruebas
      url: ${{ vars.APP_BASE_URL }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión actual
        run: echo "Antes del rollback: $(scripts/coolify.sh current-tag)"

      - name: Desplegar la versión indicada
        run: scripts/coolify.sh deploy "${{ inputs.tag }}"

      - name: Verificar que la aplicación responde
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_BASE_URL }}/api/info"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::La aplicación no responde"; exit 1

      - name: Resumen
        run: |
          {
            echo "### Rollback manual ejecutado"
            echo "- Versión restaurada: \`${{ inputs.tag }}\`"
            echo "- Versión activa ahora: \`$(scripts/coolify.sh current-tag)\`"
            echo "- Info de la app: \`$(curl -fsS "${{ vars.APP_BASE_URL }}/api/info")\`"
          } >> "$GITHUB_STEP_SUMMARY"

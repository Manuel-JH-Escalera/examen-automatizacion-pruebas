# =============================================================================
# DEPLOYMENT PIPELINE (CD) - ambiente de pruebas en Coolify
#
# Se ejecuta al integrar cambios en "main" (fin del flujo GitFlow) o manualmente.
# Stages:
#   1. build-image        -> construye la imagen Docker y la publica en GHCR
#                            con el tag inmutable "sha-<commit>"
#   2. deploy-test        -> guarda el tag actualmente desplegado (para rollback)
#                            y despliega el nuevo tag en Coolify
#   3. acceptance-tests   -> pruebas de aceptación E2E con Selenium contra la URL
#                            pública del ambiente de pruebas
#   4. rollback           -> SOLO si fallan las pruebas de aceptación: vuelve al
#                            tag anterior y verifica que quedó activo
#   5. promote            -> SOLO si todo pasó: marca la imagen como "stable"
#                            (última versión conocida como buena)
#
# Secrets requeridos: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_APP_UUID
# Variable requerida: APP_BASE_URL (URL pública del ambiente de pruebas)
# =============================================================================
name: CD - Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_falla:
        description: "Forzar falla en acceptance tests para demostrar el rollback automático"
        type: boolean
        default: false

concurrency:
  group: deploy-ambiente-pruebas
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gestor-tareas

jobs:
  build-image:
    name: "Stage 1 - Build y publicación de imagen"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag de la imagen
        id: meta
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        run: |
          IMAGE="${IMAGE_NAME,,}"
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg APP_COMMIT=${{ steps.meta.outputs.commit }} \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$IMAGE:${{ steps.meta.outputs.tag }}"'`' >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: "Stage 2 - Deploy en ambiente de pruebas"
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: pruebas
      url: ${{ vars.APP_BASE_URL }}
    outputs:
      previous_tag: ${{ steps.previous.outputs.tag }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@v4

      - name: Registrar versión actualmente desplegada (para rollback)
        id: previous
        run: |
          TAG=$(scripts/coolify.sh current-tag)
          echo "Tag desplegado antes de este deploy: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Desplegar nueva versión en Coolify
        run: scripts/coolify.sh deploy "${{ needs.build-image.outputs.tag }}"

      - name: Verificar que la nueva versión está activa
        run: scripts/coolify.sh wait-version "${{ vars.APP_BASE_URL }}" "${{ needs.build-image.outputs.commit }}"

      - name: Resumen
        run: |
          {
            echo "### Despliegue en ambiente de pruebas"
            echo "- Versión anterior: \`${{ steps.previous.outputs.tag }}\`"
            echo "- Versión desplegada: \`${{ needs.build-image.outputs.tag }}\`"
            echo "- URL: ${{ vars.APP_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  acceptance-tests:
    name: "Stage 3 - Acceptance tests (Selenium)"
    runs-on: ubuntu-latest
    needs: [build-image, deploy-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas de aceptación contra el ambiente de pruebas
        run: mvn -B -ntp verify -Pacceptance -Dapp.baseUrl="${{ vars.APP_BASE_URL }}"

      - name: Resumen de resultados
        if: always()
        run: scripts/resumen-pruebas.sh "Pruebas de aceptación (E2E)" target/failsafe-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-aceptacion
          path: target/failsafe-reports

      - name: Falla simulada (solo para demostrar el rollback)
        if: ${{ inputs.simular_falla == true }}
        run: |
          echo "::error::Falla simulada en acceptance tests para demostrar el rollback automático"
          exit 1

  rollback:
    name: "Stage 4 - Rollback automático"
    runs-on: ubuntu-latest
    needs: [build-image, deploy-test, acceptance-tests]
    # Se ejecuta solo si el deploy funcionó pero las pruebas de aceptación fallaron
    if: ${{ always() && needs.deploy-test.result == 'success' && needs.acceptance-tests.result == 'failure' }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@v4

      - name: Volver a la versión anterior
        run: |
          PREV="${{ needs.deploy-test.outputs.previous_tag }}"
          if [ -z "$PREV" ] || [ "$PREV" = "${{ needs.build-image.outputs.tag }}" ]; then
            echo "No hay versión anterior distinta; se usa la imagen 'stable'"
            PREV=stable
          fi
          echo "Rollback a: $PREV"
          scripts/coolify.sh deploy "$PREV"
          echo "PREV=$PREV" >> "$GITHUB_ENV"

      - name: Verificar que la versión fallida ya no está activa
        run: |
          for i in $(seq 1 30); do
            ACTUAL=$(curl -fsS "${{ vars.APP_BASE_URL }}/api/info" | python3 -c 'import sys,json; print(json.load(sys.stdin)["commit"])' || true)
            echo "Commit activo: $ACTUAL"
            if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "${{ needs.build-image.outputs.commit }}" ]; then
              echo "Rollback verificado: la app corre la versión anterior ($ACTUAL)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::La versión fallida sigue activa"; exit 1

      - name: Resumen
        run: |
          {
            echo "### ROLLBACK ejecutado"
            echo "- Versión con problemas: \`${{ needs.build-image.outputs.tag }}\`"
            echo "- Versión restaurada: \`$PREV\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: "Stage 5 - Marcar versión como estable"
    runs-on: ubuntu-latest
    needs: [build-image, acceptance-tests]
    if: ${{ success() }}
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar la imagen como "stable"
        run: |
          IMAGE="${IMAGE_NAME,,}"
          docker pull "$IMAGE:${{ needs.build-image.outputs.tag }}"
          docker tag "$IMAGE:${{ needs.build-image.outputs.tag }}" "$IMAGE:stable"
          docker push "$IMAGE:stable"
          echo "### Versión \`${{ needs.build-image.outputs.tag }}\` promovida a \`stable\`" >> "$GITHUB_STEP_SUMMARY"

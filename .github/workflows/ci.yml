# =============================================================================
# PIPELINE DE INTEGRACIÓN CONTINUA (CI)
#
# Se ejecuta en cada push y pull request sobre las ramas del flujo GitFlow.
# Stages (jobs encadenados con "needs"):
#   1. build              -> compila y empaqueta con Maven
#   2. unit-tests         -> pruebas unitarias (JUnit 5, Surefire)
#   3. integration-tests  -> pruebas de integración (@SpringBootTest, Failsafe)
#   4. docker-image       -> verifica que la imagen Docker se construye
# =============================================================================
name: CI - Build y Pruebas

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Stage 1 - Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y empaquetar (sin pruebas)
        run: mvn -B -ntp -DskipTests package

      - name: Guardar el artefacto (jar)
        uses: actions/upload-artifact@v4
        with:
          name: gestor-tareas-jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    name: "Stage 2 - Pruebas unitarias"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias (Surefire)
        run: mvn -B -ntp test

      - name: Resumen de resultados
        if: always()
        run: scripts/resumen-pruebas.sh "Pruebas unitarias" target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes (Surefire + JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-unitarias
          path: |
            target/surefire-reports
            target/site/jacoco

  integration-tests:
    name: "Stage 3 - Pruebas de integración"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas de integración (Failsafe)
        run: mvn -B -ntp verify -DskipUnitTests=true

      - name: Resumen de resultados
        if: always()
        run: scripts/resumen-pruebas.sh "Pruebas de integración" target/failsafe-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes (Failsafe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-integracion
          path: target/failsafe-reports

  docker-image:
    name: "Stage 4 - Imagen Docker"
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker (verificación)
        run: docker build --build-arg APP_VERSION=ci --build-arg APP_COMMIT=${GITHUB_SHA::7} -t gestor-tareas:ci .

      - name: Probar que la imagen arranca y responde el health check
        run: |
          docker run -d --name app -p 8080:8080 gestor-tareas:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health; then echo; echo "Aplicación sana"; exit 0; fi
            sleep 2
          done
          echo "La aplicación no respondió"; docker logs app; exit 1

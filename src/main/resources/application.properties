# Configuración de la aplicación Gestor de Tareas
spring.application.name=gestor-tareas
server.port=${PORT:8080}

# Versión y commit desplegados (los inyecta el pipeline vía variables de entorno)
app.version=${APP_VERSION:1.0.0}
app.commit=${APP_COMMIT:local}

# Actuator: solo health e info, usados por el health check del despliegue
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
